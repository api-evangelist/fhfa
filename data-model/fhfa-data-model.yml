identifier_conventions:
  - >-
    There are no opaque or prefixed object identifiers anywhere in this surface. Every key is
    a natural key made of domain values.
  - >-
    A consumer joining FHFA HPI to other datasets must map place_id themselves; FHFA publishes
    no crosswalk to FIPS, CBSA or ZIP within these documents.
